<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAvisit Demo Site</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #fff8ef; color: #222; }
  header { background: #ff6a00; color: #fff; padding: 24px 16px; }
  main { padding: 16px; max-width: 640px; margin: auto; }
  #aavisit-status { position: fixed; bottom: 0; left: 0; right: 0; background: #111; color: #9f9; font-size: 12px; padding: 8px 12px; }
</style>
</head>
<body>
<header><h1>Demo Store</h1><p>A sample website tracked by AAvisit</p></header>
<main>
  <h2>Welcome</h2>
  <p>Browse around. Every visit is recorded by AAvisit, and the dashboard shows where visitors come from and when they are most active.</p>
</main>
<div id="aavisit-status">AAvisit: starting...</div>

<script>
(function () {
  var ENDPOINT = "YOUR_MOMEN_GRAPHQL_ENDPOINT";
  var T = "ud_visit_a34c37";
  var F = {
    visitor: "ud_visitor_id_d9b34e",
    country: "ud_country_a82290",
    page: "ud_page_161689",
    duration: "ud_duration_7c678d",
    visitedAt: "ud_visited_at_3b6084"
  };
  var HEARTBEAT_MS = 10000;
  var statusEl = document.getElementById("aavisit-status");
  function status(t) { statusEl.textContent = "AAvisit: " + t; }

  function gql(query, variables) {
    return fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: query, variables: variables }),
      keepalive: true
    }).then(function (r) { return r.json(); });
  }

  function visitorId() {
    var k = "aavisit_vid", id = null;
    try { id = localStorage.getItem(k); } catch (e) {}
    if (!id) {
      id = "v_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem(k, id); } catch (e) {}
    }
    return id;
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, ms); })
    ]);
  }

  function getCountry() {
    return withTimeout(fetch("https://ipapi.co/json/").then(function (r) { return r.json(); }), 3000)
      .then(function (d) { if (!d.country_name) throw 0; return d.country_name; })
      .catch(function () {
        return withTimeout(fetch("https://api.country.is/").then(function (r) { return r.json(); }), 3000)
          .then(function (d) {
            try { return new Intl.DisplayNames(["en"], { type: "region" }).of(d.country); }
            catch (e) { return d.country || "Unknown"; }
          })
          .catch(function () { return "Unknown"; });
      });
  }

  var start = Date.now(), rowId = null;

  getCountry().then(function (country) {
    var obj = {};
    obj[F.visitor] = visitorId();
    obj[F.country] = country;
    obj[F.page] = location.pathname;
    obj[F.duration] = "0";
    obj[F.visitedAt] = new Date().toISOString();

    var insert = "mutation($object: " + T + "_insert_input!) { insert_" + T + "_one(object: $object) { id } }";
    return gql(insert, { object: obj }).then(function (res) {
      var row = res && res.data && res.data["insert_" + T + "_one"];
      if (!row) { status("insert FAILED: " + JSON.stringify(res).slice(0, 200)); return; }
      rowId = row.id;
      status("tracking visit #" + rowId + " from " + country);
      setInterval(beat, HEARTBEAT_MS);
    });
  }).catch(function (e) { status("error: " + e); });

  function beat() {
    if (!rowId || document.hidden) return;
    var secs = Math.round((Date.now() - start) / 1000);
    var update = "mutation($id: bigint!, $set: " + T + "_set_input!) { update_" + T + "_by_pk(pk_columns: {id: $id}, _set: $set) { id } }";
    var set = {}; set[F.duration] = String(secs);
    gql(update, { id: rowId, set: set }).then(function (res) {
      if (res && res.errors) status("update FAILED: " + JSON.stringify(res.errors).slice(0, 200));
      else status("visit #" + rowId + " · " + secs + "s on page");
    });
  }
  window.addEventListener("pagehide", beat);
})();
</script>
</body>
</html>
